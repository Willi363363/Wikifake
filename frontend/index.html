<head>

  <title>WikiFake — saurez-vous repérer les fausses informations ?</title>

  <meta property="og:locale" content="fr_FR">
  <meta property="og:url" content="https://wikifake.onrender.com/">

  <meta property="og:description"
    content="Un article Wikipédia, quelques faits truqués par une IA, et vous. Retrouvez-les seul ou à plusieurs.">
  <meta property="og:image" content="https://wikifake.onrender.com/image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="WikiFake — saurez-vous repérer les fausses informations ?">

    content="Un article Wikipédia, quelques faits truqués par une IA, et vous.">
