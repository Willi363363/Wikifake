<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wikifake — Anomaly Detection</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/styles.css">
<style>
  #splash {
    position: fixed; inset: 0;
    background: #f6f4ef;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
    color: #18181b;
    transition: opacity 360ms ease;
    font-family: 'Geist', system-ui, sans-serif;
  }
  #splash.fade { opacity: 0; pointer-events: none; }
  #splash .logo {
    width: 38px; height: 38px;
    border-radius: 12px;
    background: linear-gradient(135deg, #1f574d, #2a7568);
    display: flex; align-items: center; justify-content: center;
    color: white;
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 26px; font-style: italic;
    box-shadow: 0 4px 14px rgba(31, 87, 77, 0.25);
    margin-bottom: 16px;
    overflow: hidden;
  }
  #splash .logo img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 12px;
  }
  #splash .name {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 32px;
    letter-spacing: -0.01em;
  }
  #splash .sub {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #71717a;
    margin-top: 8px;
  }
  #splash .col { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
  <div id="splash">
    <div class="col">
      <div class="logo"><img src="/public/image.png"></div>
      <div class="name">Wikifake</div>
      <div class="sub">Initializing intelligence system</div>
    </div>
  </div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="components/tweaks-panel.jsx"></script>
  <script type="text/babel" src="data/article-data.jsx"></script>
  <script type="text/babel" src="components/hud.jsx"></script>
  <script type="text/babel" src="components/waiting-screen.jsx"></script>
  <script type="text/babel" src="components/lobby.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script>
    const obs = new MutationObserver(() => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        setTimeout(() => document.getElementById('splash').classList.add('fade'), 200);
        obs.disconnect();
      }
    });
    obs.observe(document.getElementById('root'), { childList: true });
  </script>
</body>
</html>
