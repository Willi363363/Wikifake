# Configuration du service Render, versionnée.
#
# ⚠️  Ce fichier ne prend effet que si le service est rattaché à un Blueprint
#     (Render → New → Blueprint, ou « Sync Blueprint » sur un service
#     existant). Tant que le service est configuré à la main dans le tableau
#     de bord, ce fichier ne fait que documenter la configuration attendue —
#     et c'est déjà utile : il dit ce qui doit être vrai.
#
# Les clés d'API ne sont PAS ici : `sync: false` demande à Render de les
# conserver telles qu'elles sont définies dans le tableau de bord.

services:
  - type: web
    name: wikifake
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    branch: main

    # Redéploiement automatique à chaque push sur `main`.
    autoDeploy: true

    # Render interroge cette route pour décider si l'instance est saine, et
    # attend qu'elle réponde avant de basculer le trafic sur la nouvelle
    # version : c'est ce qui rend un déploiement observable.
    healthCheckPath: /api/health

    envVars:
      # Renseignée dans le tableau de bord, jamais dans le dépôt.
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gemini-3.1-flash-lite
      - key: LOG_LEVEL
        value: INFO
