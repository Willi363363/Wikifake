# Render service configuration, versioned.
#
# ⚠️  This file only takes effect if the service is attached to a Blueprint
#     (Render → New → Blueprint, or "Sync Blueprint" on an existing service).
#     While the service is configured by hand in the dashboard, this file only
#     documents the expected configuration — which is already useful: it says
#     what must be true.
#
# API keys are NOT here: `sync: false` asks Render to keep them as defined in
# the dashboard.

services:
  # Preproduction. Same image, same configuration, `staging` branch.
  # This is what makes promoting `staging` to `main` mean something: with no
  # environment behind it, the branch is only a ritual.
  - type: web
    name: wikifake-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    branch: staging
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gemini-3.1-flash-lite
      - key: LOG_LEVEL
        value: DEBUG

  - type: web
    name: wikifake
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    branch: main

    # Automatic redeploy on every push to `main`.
    autoDeploy: true

    # Render polls this route to decide whether the instance is healthy, and
    # waits for it to answer before switching traffic to the new version: this
    # is what makes a deployment observable.
    healthCheckPath: /api/health

    envVars:
      # Set in the dashboard, never in the repository.
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL_NAME
        value: gemini-3.1-flash-lite
      - key: LOG_LEVEL
        value: INFO
