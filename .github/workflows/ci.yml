name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

# Un push sur une branche qui a une PR ouverte déclenche deux runs (push +
# pull_request) : on n'en garde qu'un, et un nouveau push annule le run
# précédent sur le même ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Smoke test (server-side render)
        working-directory: frontend
        run: npm run smoke

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Create dummy .env
        run: |
          echo "GOOGLE_API_KEY=dummy-test-key-for-ci" > .env
          echo "MODEL_NAME=gemini-3.1-flash-lite" >> .env
          echo "OPENAI_API_KEY=sk-dummy-key" >> .env


      - name: Run tests
        run: python -m pytest backend/tests/ -v
