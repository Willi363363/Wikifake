name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read
  pull-requests: read

# A new push on the same ref cancels the previous run.
#
# The group stays keyed on `github.ref`, which differs between the two
# triggers (`refs/heads/<branch>` vs `refs/pull/N/merge`): they must NOT be
# merged here, otherwise the `push` run would cancel the `pull_request` run
# the PR is validated on. Deduplication is handled by the `guard` job below.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # On a branch that already has an open PR TO MAIN, GitHub triggers two
    # runs for the same commit: a `push` and a `pull_request`. Both execute
    # exactly the same checks, doubling the minutes consumed and showing a
    # duplicate among the PR's checks.
    #
    # We keep the `pull_request` run — the one the PR is validated on — and
    # skip the `push` run.
    #
    # "targeting an integration branch" is the essential condition:
    # `pull_request` only fires for PRs targeting `main` or `staging`. A
    # phase PR (base = the umbrella branch of a rework) produces none, so
    # skipping its `push` run would leave it WITHOUT ANY checks. A branch
    # with no PR is still checked on every push, as `push: '**'` intended.
    #
    # NOTE: this job's check context is deliberately still named in French —
    # it is referenced by the branch-protection ruleset's required checks.
    # It gets renamed in phase 9, together with the ruleset's required checks.
    name: Ce run est-il utile ?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -u

          # Anything other than a branch push: we run.
          if [ "$EVENT" != "push" ] || [ "$BRANCH" = "main" ] || [ "$BRANCH" = "staging" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "event $EVENT on $BRANCH — running"
            exit 0
          fi

          # Filtering on the base branch is essential: see the comment above.
          # A PR to main OR staging produces a `pull_request` run; any other
          # base (a phase umbrella branch) produces none.
          covered=0
          for base in main staging; do
            n=$(gh pr list --repo "$REPO" --head "$BRANCH" --base "$base" \
                  --state open --json number --jq 'length' 2>/dev/null || echo 0)
            covered=$(( covered + ${n:-0} ))
          done

          if [ "${covered:-0}" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Run skipped"
              echo
              echo "A PR to \`main\` or \`staging\` is open for \`$BRANCH\`:"
              echo "the \`pull_request\` run already covers this commit."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "no PR to main or staging for $BRANCH — running"
          fi

  monorepo:
    name: monorepo
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version comes from `.nvmrc`: a single source of truth, and
      # `engines` in the root package.json rejects any older runtime.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check

  frontend:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Smoke test (server-side render)
        working-directory: frontend
        run: npm run smoke

  backend:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Create dummy .env
        run: |
          echo "GOOGLE_API_KEY=dummy-test-key-for-ci" > .env
          echo "MODEL_NAME=gemini-3.1-flash-lite" >> .env
          echo "OPENAI_API_KEY=sk-dummy-key" >> .env

      - name: Run tests
        run: python -m pytest backend/tests/ -v
