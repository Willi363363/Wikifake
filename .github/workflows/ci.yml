name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read
  pull-requests: read

# Un nouveau push sur la même référence annule le run précédent.
#
# Le groupe reste basé sur `github.ref`, qui diffère entre les deux
# déclencheurs (`refs/heads/<branche>` contre `refs/pull/N/merge`) : il ne
# faut PAS les fusionner ici, sinon le run `push` annulerait le run
# `pull_request` sur lequel la PR est validée. La déduplication est faite par
# le job `guard` ci-dessous.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # Sur une branche qui a déjà une PR ouverte VERS MAIN, GitHub déclenche
    # deux runs pour un même commit : un `push` et un `pull_request`. Les deux
    # exécutent exactement les mêmes vérifications, doublant la consommation de
    # minutes et affichant un doublon dans les checks de la PR.
    #
    # On garde le run `pull_request` — c'est celui sur lequel la PR est
    # validée — et on saute le run `push`.
    #
    # « vers une branche intégratrice » est la condition essentielle :
    # `pull_request` ne se déclenche que pour les PR ciblant `main` ou
    # `staging`. Une PR de phase (base = la branche parapluie d'une refonte)
    # n'en produit aucun, donc sauter son run `push` la laisserait SANS AUCUNE
    # vérification. Une branche sans PR reste vérifiée à chaque push, comme le
    # voulait `push: '**'`.
    name: Ce run est-il utile ?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -u

          # Tout sauf un push de branche : on exécute.
          if [ "$EVENT" != "push" ] || [ "$BRANCH" = "main" ] || [ "$BRANCH" = "staging" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "événement $EVENT sur $BRANCH — on exécute"
            exit 0
          fi

          # Filtrer sur la base est indispensable : voir le commentaire ci-dessus.
          # Une PR vers main OU staging produit un run `pull_request` ; toute
          # autre base (branche parapluie de phase) n'en produit aucun.
          covered=0
          for base in main staging; do
            n=$(gh pr list --repo "$REPO" --head "$BRANCH" --base "$base" \
                  --state open --json number --jq 'length' 2>/dev/null || echo 0)
            covered=$(( covered + ${n:-0} ))
          done

          if [ "${covered:-0}" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Run ignoré"
              echo
              echo "Une PR vers \`main\` ou \`staging\` est ouverte pour \`$BRANCH\` :"
              echo "le run \`pull_request\` couvre déjà ce commit."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "aucune PR vers main ni staging pour $BRANCH — on exécute"
          fi

  frontend:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Smoke test (server-side render)
        working-directory: frontend
        run: npm run smoke

  backend:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Create dummy .env
        run: |
          echo "GOOGLE_API_KEY=dummy-test-key-for-ci" > .env
          echo "MODEL_NAME=gemini-3.1-flash-lite" >> .env
          echo "OPENAI_API_KEY=sk-dummy-key" >> .env


      - name: Run tests
        run: python -m pytest backend/tests/ -v
