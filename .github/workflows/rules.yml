name: rules

# Application des règles de plans/methode/02-regles-du-depot.md côté serveur.
#
# Les hooks locaux (.githooks/) donnent le retour immédiat mais se contournent
# avec --no-verify. Ce workflow est le contrôle qui compte : il rejoue les mêmes
# vérifications (scripts/checks.sh) sur la plage de commits de la PR, et détecte
# les pushes directs sur main que la branch protection GitHub n'aurait pas bloqués.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformite:
    name: Conformité de la PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nom de branche
        run: bash scripts/checks.sh branch "${{ github.event.pull_request.head.ref }}"

      - name: Contenu des fichiers modifiés
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/checks.sh diff "$BASE" "$HEAD"

      - name: Messages de commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            printf '\n%s %s\n' "$sha" "$(head -1 /tmp/msg)"
            bash scripts/checks.sh commit-msg /tmp/msg || status=1
          done
          exit $status

      - name: Résumé
        if: always()
        run: |
          {
            echo '## Conformité'
            echo
            if [ '${{ job.status }}' = 'success' ]; then
              echo 'Branche, contenu et messages de commit conformes aux règles du dépôt.'
            else
              echo 'Une règle du dépôt n'"'"'est pas respectée — voir les étapes ci-dessus.'
              echo
              echo 'Pour reproduire en local : `bash scripts/checks.sh diff origin/main`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  revue-humaine:
    name: Revue humaine
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Avec un seul compte GitHub, aucun contrôle serveur ne distingue un
      # humain d'un agent : les deux portent le même jeton. La porte est donc
      # posée là où les agents s'exécutent — `.claude/settings.json` leur
      # refuse `gh pr merge`, `gh pr review` et `gh pr edit` — et ce check
      # rend le geste humain explicite et horodaté dans le journal du dépôt.
      - name: Exiger le label « revu »
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          case ",$LABELS," in
            *,revu,*)
              echo "Label « revu » présent — cette PR a été relue par un humain."
              ;;
            *)
              {
                echo '## Revue humaine manquante'
                echo
                echo 'Cette PR attend le label `revu`, apposé à la main après lecture.'
                echo
                echo 'Un agent ne peut pas se le donner : `.claude/settings.json`'
                echo 'lui refuse `gh pr edit`, `gh pr review` et `gh pr merge`.'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Label 'revu' absent — voir plans/methode/03-infrastructure.md"
              exit 1
              ;;
          esac

  fuite-de-secrets:
    name: Analyse de secrets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `scripts/checks.sh` fait une détection par expressions régulières, utile
      # et immédiate. gitleaks est l'outil dédié : il connaît les formats, et
      # scanne l'historique de la plage, pas seulement le contenu final.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  push-direct:
    name: Aucun push direct sur main ni staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Détective, pas préventif : la prévention est la branch protection GitHub.
      # Si un commit arrive sur main sans PR associée, on le signale bruyamment.
      - name: Vérifier que le commit vient d'une pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event.created }}" = 'true' ]; then
            echo 'Création de branche — rien à vérifier.'; exit 0
          fi
          count=$(gh api "/repos/${{ github.repository }}/commits/$SHA/pulls" \
            --jq 'length' 2>/dev/null || echo 0)
          if [ "$count" -eq 0 ]; then
            {
              echo '## Push direct sur `${{ github.ref_name }}` détecté'
              echo
              echo "Le commit \`$SHA\` n'est associé à aucune pull request."
              echo
              echo 'Aucun push direct sur une branche intégratrice, humain ou agent.'
              echo 'Activez la branch protection si ce n'"'"'est pas déjà fait.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Push direct sur ${{ github.ref_name }} — voir plans/methode/02-regles-du-depot.md"
            exit 1
          fi
          echo "Commit rattaché à $count pull request(s)."
