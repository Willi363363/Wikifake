name: Deploy check

# After a push to `main`, checks that production actually serves this commit.
#
# Without this, the only way to know whether a merge had been redeployed was
# to open the Render dashboard: no commit status, no GitHub deployment, no
# environment was published on the repository.
#
# The job skips itself cleanly if the `DEPLOY_URL` repository variable is not
# set — so it will never fail the CI of a fork or a clone.
#
#   Settings → Secrets and variables → Actions → Variables → New
#   DEPLOY_URL         = https://<production-service>.onrender.com
#   STAGING_DEPLOY_URL = https://<preproduction-service>.onrender.com
#
# Each branch has its own probe: a push to `staging` checks pre-production,
# a push to `main` checks production.

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: "Maximum time to wait for the redeploy"
        required: false
        default: "600"

permissions:
  contents: read

jobs:
  deployed-commit:
    # NOTE: this job's check context is deliberately still named in French —
    # it is referenced by the branch-protection ruleset's required checks.
    # It gets renamed in phase 9, together with the ruleset's required checks.
    name: L'environnement sert-il ce commit ?
    runs-on: ubuntu-latest
    steps:
      - name: Determine which environment to probe
        id: config
        env:
          URL_MAIN: ${{ vars.DEPLOY_URL }}
          URL_STAGING: ${{ vars.STAGING_DEPLOY_URL }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "staging" ]; then
            DEPLOY_URL="$URL_STAGING"; VAR_NAME=STAGING_DEPLOY_URL; ENVIRONMENT=pre-production
          else
            DEPLOY_URL="$URL_MAIN"; VAR_NAME=DEPLOY_URL; ENVIRONMENT=production
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          if [ -z "$DEPLOY_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy probe skipped"
              echo
              echo "The repository variable \`$VAR_NAME\` is not set."
              echo "Set it in **Settings → Secrets and variables → Actions → Variables**"
              echo "so that CI itself reports whether the environment is up to date."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the deployed commit to match
        if: steps.config.outputs.configured == 'true'
        env:
          DEPLOY_URL: ${{ steps.config.outputs.url }}
          ENVIRONMENT: ${{ steps.config.outputs.environment }}
          EXPECTED: ${{ github.sha }}
          TIMEOUT: ${{ github.event.inputs.timeout_seconds || '600' }}
        run: |
          set -u
          url="${DEPLOY_URL%/}/api/health"
          deadline=$(( $(date +%s) + TIMEOUT ))
          attempt=0
          served=""

          echo "Expected commit : ${EXPECTED:0:7}"
          echo "Probe           : $url"

          while [ "$(date +%s)" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            body=$(curl -fsS --max-time 20 "$url" 2>/dev/null || true)

            if [ -n "$body" ]; then
              served=$(printf '%s' "$body" | python3 -c \
                'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
              version=$(printf '%s' "$body" | python3 -c \
                'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
              echo "attempt $attempt — version=$version commit=${served:0:7}"

              if [ "$served" = "$EXPECTED" ]; then
                {
                  echo "### ✅ $ENVIRONMENT up to date"
                  echo
                  echo "| | |"
                  echo "|---|---|"
                  echo "| Served version | \`$version\` |"
                  echo "| Served commit | \`${served:0:7}\` |"
                  echo "| URL | $DEPLOY_URL |"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            else
              echo "attempt $attempt — no response (deploy in progress?)"
            fi
            sleep 15
          done

          {
            echo "### ⚠️ $ENVIRONMENT does not serve this commit yet"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Expected commit | \`${EXPECTED:0:7}\` |"
            echo "| Served commit | \`${served:0:7}\` |"
            echo "| Timeout | ${TIMEOUT}s |"
            echo
            if [ -z "$served" ]; then
              echo "No response from the probe: service asleep (free plan),"
              echo "deploy still in progress, or incorrect URL."
            else
              echo "The service responds, but with an earlier version:"
              echo "automatic deploys may be disabled."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
